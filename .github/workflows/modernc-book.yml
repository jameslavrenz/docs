name: Modern C23 Book Examples
on:
  push:
    paths:
      - 'modernc_book/**'
      - '.github/workflows/modernc-book.yml'
  pull_request:
    paths:
      - 'modernc_book/**'
      - '.github/workflows/modernc-book.yml'
  workflow_dispatch:
jobs:
  examples:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-14, clang-18]
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          if [ "${{ matrix.compiler }}" = "gcc-14" ]; then
            sudo apt-get install -y gcc-14
          else
            sudo apt-get install -y clang-18
          fi
      - name: Check manuscript structure
        working-directory: modernc_book
        run: python3 scripts/check_manuscript.py
      - name: Compile complete chapter listings
        working-directory: modernc_book
        env:
          CC: ${{ matrix.compiler }}
        run: python3 scripts/check_listings.py
      - name: Compile and test all book examples
        working-directory: modernc_book
        env:
          CC: ${{ matrix.compiler }}
        run: |
          make clean
          # Clang 18 incorrectly classifies C23's 0b binary literals as a GNU
          # extension under -Wpedantic. Keep -Werror for all other diagnostics.
          extra_flags=''
          if [ "$CC" = 'clang-18' ]; then
            extra_flags='-Wno-gnu-binary-literal'
          fi
          make CFLAGS="-std=c23 -Wall -Wextra -Wpedantic -Werror -O2 $extra_flags" check
